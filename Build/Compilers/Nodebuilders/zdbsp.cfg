
compilers
{
	// This defines what files a compiler uses
	// The setting named "program" defines what .exe to run
	zdbsp
	{
		interface = "NodesCompiler";
		program = "zdbsp.exe";
	}
	zdbsp-linux
	{
		interface = "NodesCompiler";
		program = "zdbsp";
	}
}


// Below are configurations for this nodebuilder. If you want to make your own configurations,
// it is recommended to do so in your own file as this file will be updated each release.

// NOTE: Nodebuilder configuration key names defined here must be unique for all nodebuilders!
// Recommend to start the key name with the name of the compiler, followed by underscore and a specific name.

// The "compiler" setting must refer to an existing compiler (such as defined above), but it
// does not have to be a compiler defined in the same configuration file.

nodebuilders
{
	zdbsp_auto
	{
		title = "Automatic - Legacy Safe";
		description = "Keeps Automatic selected while using the original UZB Normal node-building profile for this map format. Every save, test, and manual rebuild generates fresh nodes; cached and experimental node output is never reused.";
		compiler = "zdbsp";
		// Safe fallback. UZB resolves this to the matching legacy Normal profile.
		parameters = "-c -X -o%FO %FI";
	}

	zdbsp_normal
	{
		title = "ZDBSP - Normal (no reject)";
		description = "Legacy binary maps: recommended normal-quality build for saving.";
		compiler = "zdbsp";
		parameters = "-c -o%FO %FI";
		// -c adds comment indices in UDMF format. This is not documented in the ZDBSP usage.
	}
	
	zdbsp_udmf_normal
	{
		title = "ZDBSP - UDMF Normal (no reject)";
		description = "Recommended for saving SRB2 UDMF maps. Balanced and compatible final nodes.";
		compiler = "zdbsp";
		parameters = "-c -X -o%FO %FI";
		// -c adds comment indices in UDMF format. This is not documented in the ZDBSP usage.
	}

	zdbsp_fast
	{
		title = "ZDBSP - Normal (zero reject)";
		description = "Legacy binary maps: quicker test build with an empty REJECT table.";
		compiler = "zdbsp";
		parameters = "-R -o%FO %FI";
	}
	
	zdbsp_udmf_fast
	{
		title = "ZDBSP - UDMF Normal (zero reject)";
		description = "Recommended for frequent SRB2 UDMF test launches; faster node builds.";
		compiler = "zdbsp";
		parameters = "-R -X -o%FO %FI";
	}
	
	zdbsp_compressed
	{
		title = "ZDBSP - Compress nodes";
		description = "Legacy binary maps: creates compressed node data when file size matters.";
		compiler = "zdbsp";
		parameters = "-z -o%FO %FI";
	}

	zdbsp_udmf_compressed
	{
		title = "ZDBSP - Compress nodes (UDMF)";
		description = "Creates smaller UDMF node data. Useful for file size, not normally faster in-game.";
		compiler = "zdbsp";
		parameters = "-X -z -o%FO %FI";
	}
	
	zdbsp_udmf_compressed_huge
	{
		title = "ZDBSP - Compress nodes (UDMF) (Large Maps)";
		description = "Only for maps that exceed normal node limits or fail the standard UDMF build.";
		compiler = "zdbsp";
		parameters = "-X -z -s016 -p128 -d032 -G -5 -o%FO %FI";
	}

	//Linux Nodebuilders

	zdbsp-linux_normal
	{
		title = "[Linux] ZDBSP - Normal (no reject)";
		compiler = "zdbsp-linux";
		parameters = "-c -o%FO %FI";
		// -c adds comment indices in UDMF format. This is not documented in the ZDBSP usage.
	}
	
	zdbsp-linux_udmf_normal
	{
		title = "[Linux] ZDBSP - UDMF Normal (no reject)";
		compiler = "zdbsp-linux";
		parameters = "-c -X -o%FO %FI";
		// -c adds comment indices in UDMF format. This is not documented in the ZDBSP usage.
	}

	zdbsp-linux_fast
	{
		title = "[Linux] ZDBSP - Normal (zero reject)";
		compiler = "zdbsp-linux";
		parameters = "-R -o%FO %FI";
	}
	
	zdbsp-linux_udmf_fast
	{
		title = "[Linux] ZDBSP - UDMF Normal (zero reject)";
		compiler = "zdbsp-linux";
		parameters = "-R -X -o%FO %FI";
	}
	
	zdbsp-linux_compressed
	{
		title = "[Linux] ZDBSP - Compress nodes";
		compiler = "zdbsp-linux";
		parameters = "-z -o%FO %FI";
	}

	zdbsp-linux_udmf_compressed
	{
		title = "[Linux] ZDBSP - Compress nodes (UDMF)";
		compiler = "zdbsp-linux";
		parameters = "-X -z -o%FO %FI";
	}
	
	zdbsp-linux_udmf_compressed_huge
	{
		title = "[Linux] ZDBSP - Compress nodes (UDMF) (Large Maps)";
		compiler = "zdbsp-linux";
		parameters = "-X -z -s016 -p128 -d032 -G -5 -o%FO %FI";
	}
}
